<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5A524" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#47250A" media="(prefers-color-scheme: dark)">
<title>{{ title }}</title>
<style>
:root{
  --field:#F5A524;--ink:#1B1003;--stripe:#1B1003;--wait:rgba(27,16,3,.2);--now:rgba(27,16,3,.5);
  --flag:#FFF8E8;--alarm:#6E1205;--slab:#1B1003;--on-slab:#FFC861;
  --cond:"DIN Condensed","Bahnschrift Condensed","Bahnschrift","Avenir Next Condensed",sans-serif-condensed,"Roboto Condensed","Liberation Sans Narrow","Arial Narrow",sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Liberation Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--field:#47250A;--ink:#FFE9C7;--stripe:#F5A524;--wait:rgba(245,165,36,.2);--now:rgba(245,165,36,.5);
    --flag:#FFFFFF;--alarm:#FFC2B0;--slab:#F5A524;--on-slab:#1B1003;color-scheme:dark}
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--field);color:var(--ink);font:400 1.0625rem/1.5 var(--text)}
main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "add" "jobs" "gpu";
  max-width:40rem;margin:0 auto;
  padding:max(1.5rem,env(safe-area-inset-top)) max(1.25rem,env(safe-area-inset-right)) max(2rem,env(safe-area-inset-bottom)) max(1.25rem,env(safe-area-inset-left))}
h1{grid-area:head;margin:0 0 1.25rem;font:700 clamp(4rem,21vw,7rem)/.84 var(--cond);letter-spacing:-.012em;text-wrap:balance}
#add{grid-area:add}
#box{min-width:0;margin:0;padding:0;border:0}
#voiceRow{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem}
select{flex:1;min-height:3rem;padding:0 .75rem;font:inherit;color:inherit;background:transparent;border:2px solid var(--ink);border-radius:3px}
#mode{display:flex;margin-bottom:.75rem;border:2px solid var(--ink);border-radius:3px}
#mode label{flex:1 1 0;display:flex;min-width:0}
#mode input{position:absolute;width:1px;height:1px;margin:0;opacity:0}
#mode span{flex:1;display:flex;align-items:center;justify-content:center;min-height:2.75rem;padding:.25rem .5rem;font-weight:600;line-height:1.2;text-align:center;cursor:pointer}
#mode input:checked+span{background:var(--ink);color:var(--field)}
textarea{display:block;width:100%;height:13rem;min-height:7rem;margin:0;padding:.6rem .75rem;font:inherit;color:inherit;background:transparent;border:2px solid var(--ink);border-radius:3px;resize:vertical}
textarea::placeholder{color:inherit;opacity:.65}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;min-height:13rem;padding:1rem;border:2px dashed var(--ink);border-radius:3px;text-align:center}
#drop.over{background:var(--wait);border-style:solid}
#file{position:absolute;width:1px;height:1px;opacity:0}
#pick{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1.1rem;border:2px solid var(--ink);border-radius:3px;font-weight:600;cursor:pointer}
#pick:hover{background:var(--wait)}
#chosen{align-self:stretch;margin:.4rem 0 0;padding:0;list-style:none;text-align:left}
#chosen li{display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--now)}
#chosen span{flex:1;min-width:0;overflow-wrap:anywhere}
#chosen button{flex:none;width:2.75rem;height:2.75rem;padding:0;background:none;border:0;color:inherit;font:400 1.6rem/1 var(--text);cursor:pointer}
#go{display:flex;align-items:center;justify-content:center;width:100%;min-height:5rem;margin-top:.75rem;padding:.75rem 1rem;background:var(--slab);color:var(--on-slab);font:700 2.1rem/1 var(--cond);border:0;border-radius:3px;cursor:pointer}
#go:disabled{opacity:.4;cursor:default}
#go[aria-busy=true]{opacity:.75;cursor:progress}
#box:disabled :is(#voiceRow,#mode,textarea,#drop){opacity:.6}
#file:focus-visible+#pick,button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#mode:has(:focus-visible){outline:3px solid var(--ink);outline-offset:3px}
#hint{margin:.6rem 0 0}
#err{margin:.6rem 0 0;font-weight:600;color:var(--alarm);white-space:pre-line}
#jobs{grid-area:jobs;margin-top:2.25rem}
#empty{margin:0}
.job{padding-bottom:2.25rem}
.job h2{margin:0;font:700 1.75rem/1.08 var(--cond);overflow-wrap:anywhere}
.state{margin:.3rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.job[data-status=failed] .state{color:var(--alarm);font-weight:600}
canvas{display:block;width:100%;height:5.5rem;margin-top:.9rem}
audio{display:block;width:100%;margin-top:.9rem}
details{margin-top:.6rem}
summary{cursor:pointer;font-weight:600;min-height:2.75rem;display:flex;align-items:center}
details ol{margin:.25rem 0 0;padding-left:1.4rem}
details li{margin-bottom:.5rem;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem 1.5rem;margin-top:.6rem}
.actions a,.actions button{display:inline-flex;align-items:center;min-height:2.75rem;padding:0;background:none;border:0;color:inherit;font:600 1.0625rem/1 var(--text);text-decoration:underline;text-underline-offset:.2em;cursor:pointer}
.actions a.save{padding:0 1.1rem;background:var(--slab);color:var(--on-slab);border-radius:3px;text-decoration:none}
#gpu{grid-area:gpu;margin:0;font-size:.95rem}
@media (min-width:62rem){
  main{max-width:74rem;column-gap:5rem;grid-template-columns:minmax(20rem,26rem) minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"head jobs" "add jobs" "gpu jobs";padding-top:3rem}
  h1{font-size:6rem}
  textarea{height:17rem}
  #drop{min-height:17rem}
  #jobs{margin-top:.5rem}
  #gpu{margin-top:1.5rem}
}
</style>
</head>
<body>
<main>
  <h1>{{ title }}</h1>
  <form id="add">
    <fieldset id="box">
      <label id="voiceRow" hidden>Stimme <select id="voice"></select></label>
      <div id="mode" role="radiogroup" aria-label="Eingabe">
        <label><input type="radio" name="mode" value="text" checked><span>Text</span></label>
        <label><input type="radio" name="mode" value="file"><span>Dokument</span></label>
      </div>
      <textarea id="text" data-mode="text" aria-label="Text" placeholder="Text hier eingeben oder einfügen …"></textarea>
      <div id="drop" data-mode="file" hidden>
        <input id="file" type="file" multiple accept=".docx,.txt,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <label id="pick" for="file">Dokument wählen</label>
        <span>oder hierher ziehen</span>
        <ul id="chosen" aria-label="Gewählte Dokumente" hidden></ul>
      </div>
      <button id="go" type="submit" aria-keyshortcuts="Control+Enter Meta+Enter">Audio erstellen</button>
    </fieldset>
    <p id="hint"><span data-mode="text">Die erste Zeile wird zum Titel der MP3.</span><span data-mode="file" hidden>DOCX oder TXT bis {{ max_upload_mb }} MB.</span> Fertige MP3s bleiben {{ keep_days }} Tage.</p>
    <p id="err" role="alert" hidden></p>
  </form>
  <section id="jobs" aria-label="Aufträge">
    <p id="empty" hidden>Noch keine Aufträge. Sobald du ein Audio erstellst, erscheint es hier.</p>
    <div id="list"></div>
  </section>
  <p id="gpu"></p>
</main>
<script>
const $=s=>document.querySelector(s), ACTIVE=new Set(['queued','preparing','waiting_gpu','starting','running','encoding']);
const items=new Map(), list=$('#list'), err=$('#err');
const form=$('#add'), box=$('#box'), textInput=$('#text'), fileInput=$('#file'), drop=$('#drop'), chosenList=$('#chosen'), go=$('#go');
const MAX_BYTES={{ max_upload_mb }}*1048576;
let timer, anyActive=false, mode='text', chosen=[], sending=false;

const num=(v,d=1)=>v.toFixed(d).replace('.',',');
function span(s){s=Math.max(1,Math.round(s));if(s<60)return s+' Sek.';
  const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h} Std. ${m} Min.`:`${m} Min.`}
const plural=(n,one,many)=>n===1?`1 ${one}`:`${n} ${many}`;
function say(j){switch(j.status){
  case'queued':return'Wartet, bis die Aufträge davor fertig sind.';
  case'preparing':return'Text wird vorbereitet.';
  case'waiting_gpu':return`Wartet auf freien Grafikspeicher: ${j.detail}.`;
  case'starting':return'Sprachmodell wird geladen. Das dauert einige Minuten.';
  case'running':return`${j.done} von ${plural(j.total,'Abschnitt','Abschnitten')} fertig`+(j.eta!=null?`, noch etwa ${span(j.eta)}`:'.');
  case'encoding':return'MP3 wird geschrieben.';
  case'done':return`${span(j.audio_sec)} Audio`+(j.factor?`, ${num(j.factor)}× schneller als Echtzeit erzeugt.`:'.');
  case'cancelled':return j.total?`Abgebrochen bei ${j.done} von ${plural(j.total,'Abschnitt','Abschnitten')}.`:'Abgebrochen.';
  case'failed':return j.error;
  default:return j.status}}

// Fortschritt als Wellenform. Lange Dokumente: ein Balken je Abschnitt. Kurze Texte: mehrere Balken je Abschnitt,
// sonst wäre ein einzelner Satz nur ein Block. Laufende Abschnitte schwingen, beim Warten zieht ein Licht darüber.
const calm=matchMedia('(prefers-reduced-motion: reduce)');
function colors(){const c=getComputedStyle(document.documentElement),g=n=>c.getPropertyValue(n).trim();
  return{'0':g('--wait'),'1':g('--now'),'2':g('--stripe'),'3':g('--flag')}}
function seeded(text){let s=0;for(const ch of text)s=Math.imul(31,s)+ch.charCodeAt(0)|0;
  return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function layout(j,W,r){
  const n=j.states.length,room=Math.max(1,Math.floor(W/(7*r)));
  if(n>=room){const step=W/n,gap=step>=4*r?Math.max(r,step*.3):0;
    return[...j.heights].map((v,i)=>({c:i,k:i,x:Math.floor(i*step),w:Math.max(1,Math.ceil(step-gap)),h:.3+.7*v/9}))}
  const weight=[...j.heights].map(Number),total=weight.reduce((a,b)=>a+b,0);
  const count=weight.map(v=>Math.max(1,Math.round(room*v/total))),step=W/count.reduce((a,b)=>a+b,0);
  const w=Math.max(r,Math.round(step*.6)),rand=seeded(j.id),bars=[];let k=0,level=.5;
  count.forEach((m,c)=>{for(let i=0;i<m;i++,k++){level=.4*level+.6*rand();
    const edge=m<5?1:Math.min(1,(i+1)/3,(m-i)/3);           // leiser an den Abschnittsgrenzen, wie Pausen
    bars.push({c,k,x:Math.floor(k*step),w,h:.12+.88*level*(.35+.65*edge)})}});
  return bars}
function paint(e,now,pal){
  const cv=e.cv,j=e.job,r=window.devicePixelRatio||1,W=Math.round(cv.clientWidth*r),H=Math.round(cv.clientHeight*r);
  if(!W||!H)return;if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  const key=W+'|'+j.heights;if(e.layoutKey!==key){e.layoutKey=key;e.bars=layout(j,W,r)}
  const x=cv.getContext('2d'),t=now/1000,live=!calm.matches;
  const span=b=>{let h=b.h;if(live&&j.states[b.c]==='1')h*=.4+.6*(.5+.5*Math.sin(t*7-b.k*.55));
    const bh=Math.max(r,Math.round(H*h));return[Math.round((H-bh)/2),bh]};
  x.clearRect(0,0,W,H);
  for(const kind of '0123'){x.fillStyle=pal[kind];
    for(const b of e.bars)if(j.states[b.c]===kind){const[y,bh]=span(b);x.fillRect(b.x,y,b.w,bh)}}
  if(live&&j.status!=='running'){const at=(t/2.4%1)*1.4-.2;x.fillStyle=pal[j.status==='encoding'?'3':'1'];
    for(const b of e.bars){const glow=1-Math.abs(b.x/W-at)/.12;
      if(glow>0){const[y,bh]=span(b);x.globalAlpha=glow;x.fillRect(b.x,y,b.w,bh)}}
    x.globalAlpha=1}
}
let frame=0,painted=0;
function animate(now){frame=0;
  const moving=[...items.values()].filter(e=>e.job&&e.job.states&&!e.cv.hidden);
  if(!moving.length||document.hidden||calm.matches)return;
  if(now-painted>=33){painted=now;const pal=colors();for(const e of moving)paint(e,now,pal)}
  frame=requestAnimationFrame(animate)}
const animateSoon=()=>{if(!frame)frame=requestAnimationFrame(animate)};
calm.addEventListener('change',animateSoon);

async function act(url,method='POST'){await fetch(url,{method});await refresh()}
function button(label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;return b}
function buildActions(e,j){
  const a=e.actions;a.replaceChildren();
  if(ACTIVE.has(j.status))a.append(button('Abbrechen',()=>act(`/api/jobs/${j.id}/cancel`)));
  if(j.status==='done'){const s=document.createElement('a');s.className='save';s.href=`/files/${j.id}?dl=1`;
    s.download=j.download_name;s.textContent='MP3 laden';a.append(s)}
  if(j.status==='failed'||j.status==='cancelled')a.append(button('Fortsetzen',()=>act(`/api/jobs/${j.id}/retry`)));
  if(!ACTIVE.has(j.status))a.append(button('Löschen',()=>{if(confirm(`${j.name} löschen?`))act(`/api/jobs/${j.id}`,'DELETE')}));
}
function buildWarnings(e,j){
  const d=e.notes,n=j.warnings.length;d.hidden=!n;
  if(+d.dataset.n===n)return;d.dataset.n=n;
  e.summary.textContent=`${plural(n,'Abschnitt','Abschnitte')} unsicher, bitte anhören`;
  e.noteList.replaceChildren(...j.warnings.map(w=>{const li=document.createElement('li');li.textContent=w.text;return li}));
}
function make(j){
  const e=document.createElement('article');e.className='job';
  e.innerHTML='<h2></h2><p class="state"></p><canvas hidden role="img"></canvas><div class="player"></div><details hidden><summary></summary><ol></ol></details><div class="actions"></div>';
  e.querySelector('h2').textContent=j.name;
  e.stateLine=e.querySelector('.state');e.cv=e.querySelector('canvas');e.player=e.querySelector('.player');
  e.notes=e.querySelector('details');e.summary=e.querySelector('summary');e.noteList=e.querySelector('ol');e.actions=e.querySelector('.actions');
  return e}
function update(e,j){
  e.job=j;e.stateLine.textContent=say(j);
  const strip=!!j.states;e.cv.hidden=!strip;
  if(strip){e.cv.setAttribute('aria-label',say(j));paint(e,performance.now(),colors())}
  if(e.dataset.status!==j.status){e.dataset.status=j.status;buildActions(e,j);
    if(j.status==='done'&&!e.player.firstChild){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=`/files/${j.id}`;e.player.append(a)}}
  buildWarnings(e,j)}
function draw(s){
  const sel=$('#voice'),key=s.voices.join('|');
  if(sel.dataset.key!==key){sel.dataset.key=key;sel.replaceChildren(...s.voices.map(v=>{const o=document.createElement('option');o.textContent=v;return o}));$('#voiceRow').hidden=s.voices.length<2}
  const seen=new Set(s.jobs.map(j=>j.id));
  for(const[id,e]of items)if(!seen.has(id)){e.remove();items.delete(id)}
  s.jobs.forEach((j,i)=>{let e=items.get(j.id);if(!e){e=make(j);items.set(j.id,e)}
    if(list.children[i]!==e)list.insertBefore(e,list.children[i]||null);update(e,j)});
  $('#empty').hidden=s.jobs.length>0;
  anyActive=s.jobs.some(j=>ACTIVE.has(j.status));
  const b=s.backend;let t={off:'Sprachmodell nicht geladen.',starting:'Sprachmodell wird geladen.',ready:'Sprachmodell geladen.'}[b.state];
  if(b.total_gib)t+=` GPU ${b.util} %, Speicher ${Math.round(b.used_gib)} von ${Math.round(b.total_gib)} GB.`;
  $('#gpu').textContent=t;animateSoon()}
function complain(m){err.textContent=m;err.hidden=!m}
let offline=false;
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw 0;draw(await r.json());if(offline){offline=false;complain('')}}
  catch{offline=true;complain('Der Server antwortet nicht. Die Seite versucht es weiter.')}}
function schedule(){clearTimeout(timer);timer=setTimeout(async()=>{await refresh();schedule()},document.hidden?15000:anyActive?1500:6000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();schedule()}});
addEventListener('resize',()=>{const pal=colors();for(const e of items.values())if(e.job&&e.job.states)paint(e,performance.now(),pal)});

// Eingabe: Text oder Dokumente. Erst „Audio erstellen“ legt die Aufträge an.
function ready(){go.disabled=mode==='text'?!textInput.value.trim():!chosen.length}
function setMode(m){
  mode=m;form.elements.namedItem('mode').value=m;
  for(const el of document.querySelectorAll('[data-mode]'))el.hidden=el.dataset.mode!==m;
  try{localStorage.setItem('audilekt.mode',m)}catch{}
  ready()}
function showChosen(){
  chosenList.replaceChildren(...chosen.map(f=>{
    const li=document.createElement('li'),name=document.createElement('span'),x=document.createElement('button');
    name.textContent=f.name;x.type='button';x.textContent='×';x.title='Entfernen';x.setAttribute('aria-label',`${f.name} entfernen`);
    x.onclick=()=>{chosen=chosen.filter(c=>c!==f);showChosen()};
    li.append(name,x);return li}));
  chosenList.hidden=!chosen.length;ready()}
function choose(files){
  const problems=[];
  for(const f of files){
    if(!/\.(docx|txt)$/i.test(f.name))problems.push(`${f.name}: Nur .docx und .txt lassen sich vorlesen.`);
    else if(f.size>MAX_BYTES)problems.push(`${f.name} ist größer als {{ max_upload_mb }} MB.`);
    else if(!chosen.some(c=>c.name===f.name&&c.size===f.size&&c.lastModified===f.lastModified))chosen.push(f)}
  complain(problems.join('\n'));showChosen()}
async function post(fields,failed){
  const fd=new FormData();for(const[k,v]of Object.entries(fields))fd.append(k,v);
  if($('#voice').value)fd.append('voice',$('#voice').value);
  try{const r=await fetch('/api/jobs',{method:'POST',body:fd});if(r.ok)return'';
    const b=await r.json().catch(()=>({}));return b.error||failed}
  catch{return`${failed} Ist der Server erreichbar?`}}
form.addEventListener('submit',async e=>{
  e.preventDefault();if(sending||go.disabled)return;
  const label=go.textContent,problems=[];
  sending=true;complain('');box.disabled=true;go.setAttribute('aria-busy','true');
  if(mode==='text'){go.textContent='Wird gesendet …';
    const p=await post({text:textInput.value},'Der Text ließ sich nicht senden.');
    if(p)problems.push(p);else textInput.value='';
    await refresh()}
  else{go.textContent='Wird hochgeladen …';
    for(const f of[...chosen]){const p=await post({file:f},`Upload von ${f.name} fehlgeschlagen.`);
      if(p)problems.push(p);else chosen=chosen.filter(c=>c!==f);
      showChosen();await refresh()}}
  go.textContent=label;go.removeAttribute('aria-busy');box.disabled=false;sending=false;
  complain(problems.join('\n'));ready();schedule()});
for(const r of form.elements.namedItem('mode'))r.addEventListener('change',()=>{complain('');setMode(r.value)});
textInput.addEventListener('input',ready);
form.addEventListener('keydown',e=>{if(e.key!=='Enter')return;   // Strg+Enter erstellt, Enter am Umschalter nicht
  if(e.ctrlKey||e.metaKey){e.preventDefault();go.click()}else if(e.target.type==='radio')e.preventDefault()});
fileInput.addEventListener('change',()=>{choose([...fileInput.files]);fileInput.value=''});
addEventListener('pageshow',ready);

// Dateien lassen sich auf die ganze Seite ziehen: Beim Ziehen zeigt die Seite das Dokumentfeld,
// ohne Ablegen kehrt sie zur vorigen Eingabe zurück.
const carriesFiles=e=>!!e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
let depth=0,before=null;
function endDrag(restore){depth=0;drop.classList.remove('over');if(restore&&before)setMode(before);before=null}
addEventListener('dragenter',e=>{if(!carriesFiles(e))return;e.preventDefault();
  if(depth++===0&&!sending){if(mode!=='file'){before=mode;setMode('file')}drop.classList.add('over')}});
addEventListener('dragover',e=>{if(carriesFiles(e)){e.preventDefault();e.dataTransfer.dropEffect=sending?'none':'copy'}});
addEventListener('dragleave',e=>{if(carriesFiles(e)&&--depth<=0)endDrag(true)});
addEventListener('drop',e=>{if(!carriesFiles(e))return;e.preventDefault();endDrag(false);if(!sending)choose([...e.dataTransfer.files])});

let saved;try{saved=localStorage.getItem('audilekt.mode')}catch{}
box.disabled=false;setMode(saved==='file'?'file':'text');
refresh().then(schedule);
</script>
</body>
</html>
